{% extends 'blog/base.html' %}

{% block title %}{{ artigo.titulo }} | DevBlog{% endblock %}

{% block content %}

<div class="row justify-content-center">
    <div class="col-lg-9">

        <a href="{% url 'home' %}" class="btn btn-outline-secondary btn-sm mb-4">
            <i class="bi bi-arrow-left me-1"></i>Voltar
        </a>

        <article class="card shadow-sm border-0">
            <div class="card-body p-4 p-md-5">

                <a href="{% url 'categoria' artigo.categoria.id %}" class="badge text-bg-primary text-decoration-none mb-3">
                    <i class="bi bi-tag-fill me-1"></i>{{ artigo.categoria.nome }}
                </a>

                <h1 class="fw-bold mb-3">{{ artigo.titulo }}</h1>

                <p class="text-muted border-bottom pb-4 mb-4">
                    <i class="bi bi-person-circle me-1"></i>{{ artigo.autor }}
                    <span class="mx-2">•</span>
                    <i class="bi bi-calendar3 me-1"></i>{{ artigo.data_publicacao|date:"d/m/Y" }}
                </p>

                <div class="fs-5" style="line-height: 1.8;">
                    {{ artigo.conteudo|linebreaks }}
                </div>

            </div>
        </article>

    </div>
</div>

{% endblock %}
